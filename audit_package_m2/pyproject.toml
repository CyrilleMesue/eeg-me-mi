[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-me-mi"
version = "0.1.0"
description = "Leakage-safe EEGMMIDB motor execution versus imagery analysis"
requires-python = ">=3.11,<3.15"
dependencies = [
  "mne>=1.7,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "pyriemann>=0.7,<1",
  "PyYAML>=6,<7",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
eeg-me-mi = "eeg_me_mi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

